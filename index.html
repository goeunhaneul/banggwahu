const DESK_COLS = [3, 6, 9, 12, 15], DESK_ROWS = [6, 9];
function classroom(o) {
  const objs = [
    { t: 'window', x: 1, y: 1, w: 3, h: 2, wall: 1, say: o.t.winL },
    { t: 'board', x: 6, y: 1, w: 7, h: 2, wall: 1, say: o.t.board },

    { t: 'podium', x: 9, y: 4, w: 2, hide: 1, id: o.id + '_pod', say: o.t.podium }
  ];
  let k = 0;
  for (const dy of DESK_ROWS) for (const dx of DESK_COLS) objs.push({ t: 'desk', x: dx, y: dy, say: o.t.desks[k++] });
  o.lockers.forEach((l, i) => objs.push(Object.assign({ t: 'locker', x: 6 + i, y: 12, hide: 1, id: o.id + '_L' + i }, l)));
  return {
    floor: o.floor, w: 20, h: 15, style: 'class', rects: [[1, 3, 18, 12]],
    objs: objs.concat(o.extra || []),
    doors: [{ x: 2, y: 13, out: [0, -1], to: o.hall, tx: o.hx, ty: 3, td: 0, label: '복도',
              need: o.need, lockMsg: o.lockMsg }]
  };
}

function buildMap(id) {
  const m = CH.maps[id]; if (m.grid) return m;
  m.id = id; m.grid = new Uint8Array(m.w * m.h);          // 0 벽, 1 바닥, 2 계단, 3 문
  for (const r of m.rects) for (let y = r[1]; y <= r[3]; y++) for (let x = r[0]; x <= r[2]; x++) m.grid[y * m.w + x] = 1;
  for (const s of (m.stairs || [])) m.grid[s.y * m.w + s.x] = 2;
  for (const d of m.doors) m.grid[d.y * m.w + d.x] = 3;
  for (const o of m.objs) { o.w = o.w || 1; o.h = o.h || 1; }
  return m;
}
const FLAT = { rug: 1, floornote: 1 };     // 밟을 수 있는 물건
function rebuildSolid() {
  const m = MAP; m.solid = new Uint8Array(m.w * m.h);
  for (let i = 0; i < m.grid.length; i++) m.solid[i] = m.grid[i] === 0 ? 1 : 0;
  for (const o of m.objs) {
    if (o.wall || FLAT[o.t]) continue;
    for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) m.solid[y * m.w + x] = 1;
  }
}
function solidAt(tx, ty) { return tx < 0 || ty < 0 || tx >= MAP.w || ty >= MAP.h || MAP.solid[ty * MAP.w + tx] === 1; }
function boxSolid(x, y) {      // 주인공 충돌 상자 10×8
  const x0 = Math.floor((x - 5) / T), x1 = Math.floor((x + 4.99) / T), y0 = Math.floor((y - 4) / T), y1 = Math.floor((y + 3.99) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) return true;
  return false;
}
// 벽·물건 안에 끼었으면 가장 가까운 빈 바닥으로 빼낸다
function unstuck() {
  if (!boxSolid(P.x, P.y)) return;
  const sx = clamp(Math.floor(P.x / T), 0, MAP.w - 1), sy = clamp(Math.floor(P.y / T), 0, MAP.h - 1);
  const seen = new Uint8Array(MAP.w * MAP.h), q = [[sx, sy]]; seen[sy * MAP.w + sx] = 1;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    if (MAP.grid[y * MAP.w + x] === 1 && !MAP.solid[y * MAP.w + x]) { P.x = x * T + 8; P.y = y * T + 8; return; }
    for (const [dx, dy] of DIRV) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MAP.w || ny >= MAP.h || seen[ny * MAP.w + nx]) continue;
      seen[ny * MAP.w + nx] = 1; q.push([nx, ny]);
    }
  }
}
function objAt(tx, ty) {
  const os = MAP.objs;
  for (let i = os.length - 1; i >= 0; i--) {
    const o = os[i];
    if (o.t !== 'rug' && tx >= o.x && tx < o.x + o.w && ty >= o.y && ty < o.y + o.h) return o;
  }
  return null;
}
// 길찾기: (sx,sy)에서 (gx,gy)로 가는 다음 타일
function bfsNext(sx, sy, gx, gy) {
  const w = MAP.w, h = MAP.h; if (sx === gx && sy === gy) return null;
  if (gx < 0 || gy < 0 || gx >= w || gy >= h || sx < 0 || sy < 0 || sx >= w || sy >= h) return null;
  const prev = new Int16Array(w * h).fill(-1), start = sy * w + sx, goal = gy * w + gx, q = [goal];
  prev[goal] = goal;
  for (let i = 0; i < q.length; i++) {
    const cur = q[i]; if (cur === start) break;
    const cx = cur % w, cy = (cur / w) | 0;
    for (const [dx, dy] of DIRV) {
      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx; if (prev[ni] !== -1) continue;
      if (MAP.solid[ni] && ni !== start) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  const p = prev[start]; if (p < 0) return null;

}

// 추격 중인가(복도형 추격자 / 화장실 그림자 / 과학실로 돌아왔을 때의 인체 모형)
function isChase() {
  return !!(G.chaser || (G.toilet && G.toilet.shadow) || (S.map === 'sci' && F.prepSeen && !F.sciDone && G.model));
}
function threatDist() {
  let d = 400; const c = G.chaser;
  if (c) d = chaserVisible(c) ? Math.hypot(c.x - P.x, c.y - P.y) : (c.pending > 0 ? 80 + c.pending : 300);
  const sh = G.toilet && G.toilet.shadow; if (sh) d = Math.min(d, Math.hypot(sh.x - P.x, sh.y - P.y));
  if (G.model && F.prepSeen) d = Math.min(d, Math.hypot(G.model.x - P.x, G.model.y - P.y));
  return d;
}

function chaserSpeed(c) {
  const gd = CH.ghosts[c.kind], k = stage();
  return onScreen(c.x, c.y) ? gd.on + (gd.onK || 0) * k : gd.off + (gd.offK || 0) * k;
}
function hideFront(o) { return o.t === 'locker' ? [o.x * T + 8, (o.y - 1) * T + 8] : [(o.x + 1) * T, (o.y + 1) * T + 8]; }
function updateChaser() {
  const c = G.chaser; if (!c) return;
  const gd = CH.ghosts[c.kind];
  if (c.hidden > 0) {                    // 퇴치 아이템으로 잠시 사라진 상태
    if (--c.hidden === 0) c.freeze = CFG.spawnFreeze;
    return;
  }
  // 안전장치: 다른 맵에 남겨졌으면 들어온 문으로 따라오게 한다
  if (c.pending <= 0 && c.map !== S.map) { c.pending = 60; c.pmap = S.map; c.px = G.entryX; c.py = G.entryY; c.map = null; }
  if (c.pending > 0) {                   // 문/계단을 따라오는 중: 발소리가 점점 커진다
    c.pending--; if (!G.hide) c.lose += 2;
    if (c.pending % 15 === 0) sfx('gstep', 0, clamp(0.45 - c.pending / 300, 0.06, 0.45));
    if (c.pending <= 0) {
      // 도착: 반드시 화면에 그려지도록 대기값을 모두 지운다
      c.pending = 0; c.hidden = 0; c.map = c.pmap; c.x = c.px; c.y = c.py; c.freeze = CFG.spawnFreeze; c.lose = 0;
      if (c.map === S.map) sfx('door');
    }
  } else if (c.freeze > 0) c.freeze--;
  else {
    c.t++;
    let tx = P.x, ty = P.y;
    if (G.hide) { const f = hideFront(G.hide.o); tx = f[0]; ty = f[1]; }
    const d = moveToward(c, tx, ty, chaserSpeed(c));
    const pan = clamp((c.x - P.x) / 200, -1, 1), dd = Math.hypot(c.x - P.x, c.y - P.y);
    if (G.hide && d < 5 && isPeekHide(G.hide)) c.dir = 3;   // 윤 선생님은 교탁 앞에 멈춰 선다(틈새 연출은 updateHide에서)
    else if (G.hide && d < 5) {          // 숨은 곳 앞에서 서성이며 문을 두드린다
      c.dir = G.hide.o.t === 'locker' ? 0 : 3; c.x += Math.sin(G.frame * 0.09) * 0.35;
      if (G.frame % 58 === 0) { sfx('knock', pan); G.shake = 6; }   // 두드릴 때 화면이 흔들린다
    } else if (c.walk % 22 === 0) sfx('gstep', pan, G.hide ? 0.5 : clamp(0.4 - dd / 700, 0.03, 0.4));
    if (gd.prints && c.t % 13 === 0) G.prints.push({ map: c.map, x: c.x, y: c.y, life: 300 });
    // 말풍선: 현심은 4.5초마다, 분신사바 귀신은 짧은 추격이라 3.3초마다
    const bp = c.kind === 'jieun' ? [270, 150] : [200, 90];
    if (c.bubble && c.t % bp[0] === bp[1]) { c.bub = 130; if (!G.hide) sfx(c.kind === 'jieun' ? 'voiceJ' : 'voiceB'); }
  }
  if (c.bub > 0) c.bub--;
  if (G.hide) return;
  if (c.pending <= 0 && c.freeze <= 0 && Math.hypot(c.x - P.x, c.y - P.y) < 10) { caught(c.kind); return; }   // 서 있는 동안은 잡지 않는다
  // 따돌리기: 귀신 시야 밖에서 약 12초
  if (gd.noLose) c.lose = 0;                                   // 윤 선생님은 숨어야만 따돌릴 수 있다
  else if (c.pending <= 0) { if (onScreen(c.x, c.y)) c.lose = 0; else c.lose++; }
  if (c.lose >= CFG.loseFrames) { G.chaser = null; say([['', '발소리가 멀어졌다. ...따돌린 것 같다.']]); }
}

/* ---- 숨기(교실 사물함·교탁 아래, 추격 중에만) ---- */
function startHide(o) { sfx('locker'); G.hide = { o: o, t: Math.round(rnd(240, 360)), done: false, kind: G.chaser && G.chaser.kind }; }
// 윤 선생님에게 쫓기다 교탁 아래에 숨었을 때만 틈새 연출이 나온다(숨을 때마다 한 번)
function isPeekHide(h) { return h && !h.peeked && h.kind === 'yoon' && h.o.t === 'podium'; }
function hideDoorPos() { const d = MAP.doors[0]; return [(d.x + d.out[0]) * T + 8, (d.y + d.out[1]) * T + 8]; }
function updateHide() {
  const h = G.hide;
  if (h.peek) { updatePeek(h); return; }             // 틈새 연출 중: 숨기 시간(카운트다운)은 멈춘다
  // 숫자는 보여 주지 않는다. 귀신이 앞에서 서성이다가 발소리가 점점 멀어지면 떠난 것.
  if (!h.done) {
    const c = G.chaser;
    if (h.t > 0) {
      if (h.peeked && c && c.map === S.map && c.pending <= 0) h.t--;   // 연출 뒤: 선생님은 문가에 말없이 서 있다
      else { h.t--; updateChaser(); }
      if (!G.chaser) h.done = true;
      else if (isPeekHide(h)) {
        // 선생님이 교탁 앞에 도착하면 틈새 시점으로 바뀐다. 도착 전에는 숨기 시간이 끝나지 않게 붙잡아 둔다.
        const f = hideFront(h.o), at = c.map === S.map && c.pending <= 0 && c.freeze <= 0 && Math.hypot(c.x - f[0], c.y - f[1]) < 5;
        if (at) { h.peek = { t: 0 }; h.peeked = true; AU.silence = true; }
        else if (h.t <= 0) { h.t = 1; if ((h.hold = (h.hold || 0) + 1) > 900) h.peeked = true; }   // 안전장치: 15초 넘게 못 오면 연출 생략
      }
      else if (h.t <= 0) h.lt = 190;                    // 떠나기 시작
    } else if (c && c.map === S.map && c.pending <= 0 && h.lt > 0) {
      h.lt--;
      const dp = hideDoorPos();
      moveToward(c, dp[0], dp[1], 0.9);
      if (c.walk % 18 === 0) sfx('gstep', clamp((c.x - P.x) / 120, -1, 1), (h.peeked ? 0.3 : 0.55) * h.lt / 190);   // 발소리가 멀어진다
    } else { h.done = true; G.chaser = null; }
    // 윤 선생님 1차 추격: 숨어서 버티면 선생님이 사라진다
    if (h.done && h.kind === 'yoon' && !F.yoon2) { F.yoonHid = 1; S.goal = 'gate'; }
  }
  if (KP.ok) {
    G.hide = null; sfx('locker');
    if (!h.done) die('hide', h.kind); else G.waitRelease = true;   // 끝나기 전에 나오면 즉사
  }
}

/* ---- 교탁 틈새 연출(윤 선생님): 쪼그려 앉아 틈새로 들여다본다 ----
   배경음은 멈추고 숨소리만. 이 동안 숨기 시간(카운트다운)은 멈추고 입력도 받지 않는다. */
const PEEK = {
  fin: 24,      // ~24  : 틈새 시점으로 바뀜
  bend: 70,     // ~70  : 교탁 앞에 선 다리
  look: 110,    // ~110 : 쪼그려 앉으며 얼굴이 내려온다
  eye: 260,     // ~260 : 틈새로 들여다보는 눈(2.5초)
  rise: 295,    // ~295 : 몸을 일으킨다
  walk: 420,    // ~420 : 천천히 걸어 나간다(발소리가 멀어짐)
  end: 450      // ~450 : 원래 화면으로
};
function updatePeek(h) {
  const p = h.peek, c = G.chaser; p.t++;
  if (p.t === PEEK.bend + 6 || p.t === PEEK.look + 72) sfx('breath', 0.24);     // 숨소리만 들린다
  if (p.t > PEEK.rise && p.t < PEEK.walk) {
    const k = p.t - PEEK.rise;
    if (k % 28 === 4) sfx('gstep', 0.35, clamp(0.5 - k / 240, 0.04, 0.5));    // 발소리가 점점 멀어진다
    if (c) { const dp = hideDoorPos(); moveToward(c, dp[0], dp[1], 0.55); }   // 실제로도 문 쪽으로 걸어간다
  }
  if (p.t >= PEEK.end) { h.peek = null; AU.silence = false; h.t = Math.max(h.t, 90); }   // 카운트다운 다시 시작
}

/* ---- 화장실: 변기 귀신 ---- */
function updateToilet() {
  const t = G.toilet; if (!t || F.toiletDone) return;
  const ps = Math.floor((P.x / T - 3) / 2);                 // 주인공이 서 있는 칸 번호
  if (!F.phoneGot) {
    if (t.flush < 0) {
      if (--t.gap <= 0) {
        const c = [0, 1, 2, 3, 4].filter(i => Math.abs(i - ps) > 1);   // 서 있거나 바로 옆인 칸은 제외
        if (c.length) { t.flush = pick(c); t.t = 150; sfx('flush', (t.flush - 2) / 2.2); } else t.gap = 20;
      }
    } else {
      t.t--; if (t.t === 70) sfx('flush', (t.flush - 2) / 2.2);
      if (P.y >= 4 * T && ps === t.flush) { caught('hand'); return; }   // 그 칸 앞을 지나가면 검은 손
      if (t.t <= 0) { t.flush = -1; t.gap = Math.round(rnd(45, 90)); }
    }
  } else {
    // 휴대폰을 찾은 뒤: 전부 물이 내려가고 화장실이 검게 물든다
    t.dark = Math.min(1, t.dark + 1 / 220);
    if (G.frame % 66 === 0) sfx('flush', rnd(-1, 1));
    if (!t.shadow) { if (t.shadowT > 0 && --t.shadowT === 0) { t.shadow = { x: 12 * T, y: 3 * T + 8, dir: 0, walk: 0, rise: 0, freeze: 0 }; sfx('jump'); } }
    else {
      const s = t.shadow;
      if (s.rise < 30) s.rise++;
      else if (s.freeze > 0) s.freeze--;
      else { moveToward(s, P.x, P.y, CH.ghosts.shadow.spd); if (s.walk % 11 === 0) G.prints.push({ map: 'toilet', x: s.x, y: s.y, life: 300, hand: 1 }); }
      if (s.rise >= 30 && Math.hypot(s.x - P.x, s.y - P.y) < 10) caught('shadow');
    }
  }
}

/* ---- 과학실: 인체 모형(바라보면 멈추고 등을 돌리면 다가온다) ---- */
function updateModel() {
  const m = G.model; if (!m || !F.jieunGone || F.sciDone) return;
  const gd = CH.ghosts.model, dx = m.x - P.x, dy = m.y - P.y, d = Math.hypot(dx, dy) || 1;
  const dot = (dx * DIRV[P.dir][0] + dy * DIRV[P.dir][1]) / d;
  if (dot < Math.cos(gd.cone * Math.PI / 180)) moveToward(m, P.x, P.y, gd.spd + gd.k * stage());
  if (d < 10) die('model');              // 아이템으로 막을 수 없다
}

/* ---- 음악실: 피아노 귀신 ---- */
function pianoStop(p) { p.state = 'stop'; p.t = 0; p.vol = 0; }
function updatePiano() {
  const p = G.piano; if (!p || F.musicDone) return;
  const gd = CH.ghosts.piano;
  if (!F.portraitTaken) { p.vol = 0.5; return; }
  if (p.state === 'off') { p.state = 'armed'; p.ox = P.x; p.oy = P.y; }
  if (p.state === 'armed') { p.vol = 0.5; if (Math.hypot(P.x - p.ox, P.y - p.oy) >= gd.arm) pianoStop(p); }   // 약 2걸음 뒤
  else if (p.state === 'stop') {         // 소리가 멈춤: 1초 반응 시간 뒤 2초 동안 움직이면 즉사
    p.vol = 0; p.t++;
    if (p.t >= gd.react && p.t < gd.react + gd.still && moveKeyDown()) { caught('piano'); return; }
    if (p.t >= gd.react + gd.still) { p.state = 'rest'; p.t = 0; p.gx = 2 * T; p.gy = clamp(P.y, 4 * T, 11 * T); }
  } else if (p.state === 'rest') { p.vol = 0.15; if (++p.t >= gd.rest) p.state = 'approach'; }
  else {
    const dx = P.x - p.gx, dy = P.y - p.gy, d = Math.hypot(dx, dy) || 1;
    p.gx += dx / d * gd.spd; p.gy += dy / d * gd.spd; p.vol = clamp(1 - (d - 20) / 260, 0.15, 1);
    if (d < gd.near) pianoStop(p);
  }
}

/* ---- 기도실: 윤 선생님(잠입) ---- */
function newYoon() {
  const Y = CH.ghosts.yoonWalk;
  return { x: Y.path[0][0] * T + 8, y: Y.path[0][1] * T + 8, seg: 1, dir: 2, fx: 1, fy: 0, walk: 0, state: 'walk', t: 0,
    next: Math.round(rnd(Y.turnMin, Y.turnMax)), mk: 30 };
}
function los(x0, y0, x1, y1) {           // 병풍·위패·제단에 가려지면 보이지 않는다
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 4);
  for (let i = 1; i < n; i++) if (solidAt(Math.floor((x0 + (x1 - x0) * i / n) / T), Math.floor((y0 + (y1 - y0) * i / n) / T))) return false;
  return true;
}
function updateYoon() {
  const y = G.yoon; if (!y) return;
  const Y = CH.ghosts.yoonWalk;
  if (y.state !== 'look') {              // 제단 주위 사각형 경로를 천천히 돈다
    const tp = Y.path[y.seg], tx = tp[0] * T + 8, ty = tp[1] * T + 8, dx = tx - y.x, dy = ty - y.y, d = Math.hypot(dx, dy);
    if (d <= Y.spd) { y.x = tx; y.y = ty; y.seg = (y.seg + 1) % Y.path.length; }
    else { y.x += dx / d * Y.spd; y.y += dy / d * Y.spd; y.fx = dx / d; y.fy = dy / d; y.walk++; y.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0); }
  }
  if (y.state === 'walk') { if (--y.next <= 0) { y.state = 'warn'; y.t = Y.warn; } }          // 목탁이 빨라지고 2초 뒤
  else if (y.state === 'warn') { if (--y.t <= 0) { y.state = 'look'; y.t = Y.look; y.fx = -y.fx; y.fy = -y.fy; y.dir = 3 - y.dir; } }   // 뒤를 돌아본다
  else if (--y.t <= 0) { y.state = 'walk'; y.next = Math.round(rnd(Y.turnMin, Y.turnMax)); y.fx = -y.fx; y.fy = -y.fy; y.dir = 3 - y.dir; }
  const dx = P.x - y.x, dy = P.y - y.y, d = Math.hypot(dx, dy) || 1;
  if (--y.mk <= 0) { y.mk = y.state === 'warn' ? 13 : 50; sfx('moktak', clamp(0.34 - d / 900, 0.1, 0.34)); }
  let seen = d < Y.near;
  if (!seen && d < Y.r && (dx * y.fx + dy * y.fy) / d >= Math.cos(Y.ang * Math.PI / 180) && los(y.x, y.y, P.x, P.y)) seen = true;
  if (seen) caught('yoonStealth');       // 발각 → 전용 배드엔딩
}

/* ---- 잡힘·퇴치 아이템·죽음 ---- */
function caught(kind) {
  if (G.invuln > 0 || G.mode !== 'play' || EV.steps) return;
  const rp = kind === 'yoonStealth' ? null : CH.repel.find(r => r.vs.includes(kind) && has(r.item));
  if (rp) {                              // 퇴치 아이템 자동 사용
    take(rp.item); G.invuln = CFG.invuln; G.flash = 30; sfx(rp.sfx);
    const c = G.chaser;
    if (c && c.kind === kind) { c.hidden = 260; c.lose = 0; }
    if (kind === 'hand') { G.toilet.flush = -1; G.toilet.gap = 120; }
    if (kind === 'shadow') { const s = G.toilet.shadow; s.x = 12 * T; s.y = 3 * T + 8; s.freeze = 160; }
    if (kind === 'piano') { const p = G.piano; p.state = 'rest'; p.t = 0; p.gx = 2 * T; p.gy = P.y; }
    say([['', rp.msg.replace('{who}', (CH.ghosts[kind] || {}).subj || '')]]);
    return;
  }
  if (kind === 'yoonStealth' || (kind === 'yoon' && S.map === 'base')) { runEvent(CH.events.altarEnd, 'altarEnd'); return; }
  die(kind);
}
function die(kind, by) {
  // TIP: 죽은 구역의 TIP과 공통 TIP 중 무작위
  const zoneTip = CH.tips[CH.tipOf[kind] || 'other'];
  const sub = (kind === 'yoon' || by === 'yoon') ? CH.caughtYoon : null;   // 선생님에게 잡힘
  G.mode = 'gameover'; G.over = { t: 0, kind: kind, sub: sub, line: Math.random() < 0.5 ? zoneTip : pick(CH.tipsCommon) };
  G.hide = null; AU.silence = false; sfx('jump');
}

/* ================= 8. 이벤트 ================= */
const EV = { steps: null, i: 0, cur: null, skip: false, name: null, queue: [] };
function runEvent(steps, name) {
  if (!steps) return;
  if (EV.steps) { EV.queue.push([steps, name]); return; }
  EV.steps = steps; EV.i = 0; EV.cur = null; EV.skip = false; EV.name = name || null;
}
function say(lines) { runEvent(lines, null); }
function endEvent() {
  EV.steps = null; EV.name = null; EV.skip = false; EV.cur = null; AU.silence = false; UI.dialog = null;
  if (G.mode === 'play' && MAP && !G.scene) {
    const l = partyList();
    for (const k in A) if (!A[k].follow && !l.includes(k)) delete A[k];
    syncParty(false);
  }
  const n = EV.queue.shift(); if (n) runEvent(n[0], n[1]);
}
function canSkip() { return !!(EV.steps && EV.name && CH.skippable.includes(EV.name) && !UI.choice && !(UI.card && UI.card.stop)); }
function gotoLabel(id) { const k = EV.steps.findIndex(s => s.t === 'label' && s.id === id); if (k >= 0) EV.i = k; }
function getActor(who) { return A[who] || (who === 'me' ? P : null); }
function snapActors() { for (const k in A) { const a = A[k]; if (a.tx !== undefined) { a.x = a.tx; a.y = a.ty; a.tx = undefined; a.moving = false; } } }
function updateActorMoves() {
  for (const k in A) {
    const a = A[k]; if (a.tx === undefined) continue;
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    if (d <= a.spd) { a.x = a.tx; a.y = a.ty; a.tx = undefined; a.moving = false; }
    else { a.x += dx / d * a.spd; a.y += dy / d * a.spd; a.walk = (a.walk || 0) + 1; a.moving = true; a.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0); }
  }
}
function toast(text) { G.toast = { text: text, t: 170 }; }
const CIRC = ['①', '②', '③', '④'];

// 스텝 종류. start가 true를 돌려주면 즉시 끝, 아니면 update가 true를 돌려줄 때까지 기다린다.
// 건너뛰기(EV.skip) 중에는 대사·대기·연출은 넘기고 진행 정보(아이템·플래그·목표·맵 이동)만 적용한다.
const STEPS = {
  say: {
    start(s) { if (EV.skip) return true; UI.dialog = { who: s.who, text: s.text, n: 0 }; },
    update() {
      const d = UI.dialog; if (!d) return true;
      if (d.n < d.text.length) { d.n = Math.min(d.text.length, d.n + 0.7); if (KP.ok) d.n = d.text.length; }
      else if (KP.ok) { UI.dialog = null; sfx('ui'); return true; }
    },
    finish() { UI.dialog = null; }
  },
  wait: { start() { return EV.skip; }, update(s, c) { return ++c.t >= s.n; } },
  sfx: { start(s) { if (!EV.skip) sfx(s.n, s.a); return true; } },
  silence: { start() { AU.silence = true; return true; } },     // 귀신 등장 직전의 완전한 정적
  amb: { start(s) { G.amb = s.v; return true; } },
  shake: { start(s) { if (!EV.skip) G.shake = s.n; return true; } },
  fade: {
    start(s) {
      const f = G.fade; f.to = s.v; if (s.color) f.color = s.color; else if (s.v === 1) f.color = '#000000';
      if (EV.skip || !s.n) { f.a = s.v; return true; } f.sp = 1 / s.n;
    },
    update() { return G.fade.a === G.fade.to; }, finish() { G.fade.a = G.fade.to; }
  },
  scene: { start(s) { G.scene = s.name; G.sv = {}; return true; } },

    snapActors();

    const raw = EV.steps[EV.i], s = Array.isArray(raw) ? { t: 'say', who: raw[0], text: raw[1] } : raw, st = STEPS[s.t];
    const steps = EV.steps;

    }

    break;

function chaseDoorOK(to) {

  const c = G.chaser;
  if (c && c.kind === 'yoon' && F.yoon2 && to === 'lobby') return true;     // 2차 추격 때만 현관으로 도망칠 수 있다
  return !!(c && CH.ghosts[c.kind].doors && CH.ghosts[c.kind].doors.includes(to));
}
// 잠긴 문: 그 문 앞 바닥 칸으로 되돌린다(벽 안에 갇히지 않게)
function pushBack(d) { P.x = (d.x + d.out[0]) * T + 8; P.y = (d.y + d.out[1]) * T + 8; G.waitRelease = true; }
function useDoor(d) {
  const locked = !d.to || (d.need && !chk(d.need)) || (d.shut && chk(d.shut));
  if (locked) { pushBack(d); sfx('locked'); say([['', d.lockMsg || '문이 잠겨 있다.']]); return; }
  if (isChase() && !chaseDoorOK(d.to)) { pushBack(d); say([['', '지금은 들어갈 수 없다. 도망쳐야 한다!']]); return; }
  if (d.ev && chk(d.ev[0])) { pushBack(d); runEvent(CH.events[d.ev[1]], d.ev[1]); return; }
  sfx('door'); enterMap(d.to, d.tx, d.ty, d.td);
}
function checkDoors() {
  const tx = Math.floor(P.x / T), ty = Math.floor(P.y / T), v = MAP.grid[ty * MAP.w + tx];
  if (v === 2) {                         // 계단: 밟는 순간 다른 층으로, 도착은 계단 바로 옆 칸
    const st = MAP.stairs.find(s => s.x === tx && s.y === ty);
    if (st) { sfx('door'); enterMap(st.to, st.tx, st.ty, 0, { stairs: 1 }); }
  } else if (v === 3 && G.doorCd <= 0) {

/* ---- 주인공 ---- */
function updatePlayer() {
  let dx = (K.right ? 1 : 0) - (K.left ? 1 : 0), dy = (K.down ? 1 : 0) - (K.up ? 1 : 0);
  if (G.waitRelease) { if (!dx && !dy) G.waitRelease = false; dx = dy = 0; }   // 방향키를 한 번 떼야 다시 움직인다
  G.moved = false;
  if (!dx && !dy) return;
  if (!K.back) {                         // Shift(X)를 누르면 바라보는 방향 유지(뒷걸음질)
    if (dx && dy) { const d = P.dir; if (!((d === 0 && dy > 0) || (d === 3 && dy < 0) || (d === 1 && dx < 0) || (d === 2 && dx > 0))) P.dir = dx < 0 ? 1 : 2; }
    else P.dir = dy > 0 ? 0 : dy < 0 ? 3 : dx < 0 ? 1 : 2;
  }
  const sp = CFG.playerSpeed * (dx && dy ? 0.7071 : 1), ox = P.x, oy = P.y;
  if (dx && !boxSolid(P.x + dx * sp, P.y)) P.x += dx * sp;
  if (dy && !boxSolid(P.x, P.y + dy * sp)) P.y += dy * sp;
  if (P.x !== ox || P.y !== oy) {
    G.moved = true; P.walk++; if (P.walk % 20 === 0) sfx('step');
    G.trail.push([P.x, P.y]); if (G.trail.length > 80) G.trail.shift();
  }
}

function txt(c, s, x, y, size, col, align, bold) {

}

  if (line) out.push(line); return out;
}
function box(c, x, y, w, h, fill, stroke) { c.fillStyle = fill; c.fillRect(x, y, w, h); if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); } }

function handText(c, text, x, y, font, size, color, align) {

  if (font === 'mono') { c.font = size + 'px ' + CFG.monoFont; c.fillText(text, x, y); return; }
  if (FONT_OK[font]) { c.font = size + 'px "' + font + '"'; c.fillText(text, x, y); return; }
  c.font = 'italic ' + Math.round(size * 0.78) + 'px ' + CFG.uiFont;
  let cx = align === 'center' ? x - c.measureText(text).width / 2 : x; c.textAlign = 'left';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], h = ((i * 7919 + text.length * 31) % 7) - 3;
    c.save(); c.translate(cx, y + h * 0.4); c.rotate(h * 0.025); c.fillText(ch, 0, 0); c.restore(); cx += c.measureText(ch).width;
  }
}

  const peek = !!(G.hide && G.hide.peek);                  // 교탁 틈새 연출 중엔 HUD를 숨긴다
  if (play && !G.scene && MAP && !peek) drawHUD(c);
  // 추격 중 붉은 테두리 맥박
  if (play && !G.scene && MAP && !peek && isChase() && !EV.steps) drawVignette(c, 0.16 + (G.beat || 0) * 0.3);
  const f = G.fade;
  if (f.a > 0) { c.globalAlpha = f.a; box(c, 0, 0, W, H, f.color); c.globalAlpha = 1; }
  if (G.flash > 0) box(c, 0, 0, W, H, 'rgba(255,250,230,' + (G.flash / 30 * 0.85) + ')');
  if (UI.card) {
    const k = UI.card; let a = clamp(k.t / (k.fin || 40), 0, 1);
    if (k.fout && k.n) a = Math.min(a, clamp((k.n - k.t) / k.fout, 0, 1));
    c.globalAlpha = a;
    k.lines.forEach((ln, i) => txt(c, ln, 240, 150 + i * 30 - (k.lines.length - 1) * 12, i === 0 && k.lines.length > 1 ? 26 : (k.size || 15), k.color, 'center', i === 0));
    if (k.hint && k.t > 60 && G.frame % 50 < 34) txt(c, k.hint, 240, 250, 10, '#888', 'center'); c.globalAlpha = 1;
  }
  if (G.scream) {      // 비명: 가운데서 크게 흔들리는 붉은 글자
    const s = G.scream, jx = rnd(-4, 4), jy = rnd(-3, 3);
    txt(c, s.text, 242 + jx, 152 + jy, 46, '#300', 'center', true); txt(c, s.text, 240 + jx, 150 + jy, 46, '#e01818', 'center', true);
  }
  if (play && G.toast && G.toast.t > 0 && !UI.note) { c.globalAlpha = clamp(G.toast.t / 30, 0, 1); c.font = '10px ' + CFG.uiFont; const w = c.measureText(G.toast.text).width + 16; box(c, 240 - w / 2, 8, w, 16, 'rgba(8,8,14,.88)', '#c8b060'); txt(c, G.toast.text, 240, 20, 10, '#ffe9a0', 'center'); c.globalAlpha = 1; }
  if (UI.dialog) drawDialog(c);
  if (UI.choice) drawChoice(c);
  if (play && canSkip()) shadowTxt(c, '건너뛰기 (Q)', 472, 16, 9, '#bbb', 'right');
  if (UI.safe) drawSafe(c);
  if (UI.book) drawBook(c);
  if (UI.note) drawNote(c);
  if (G.mode === 'title' || G.mode === 'loading') drawTitle(c);
  if (G.mode === 'gameover') drawGameOver(c);
  if (UI.settings) drawSettings(c);
}

/* ================= 10. 메인 루프 ================= */
// 고정 60fps 업데이트. 대화·컷신(이벤트) 중에는 월드가 멈춘다.
function update() {
  G.frame++;
  const f = G.fade; if (f.a !== f.to) f.a = f.a < f.to ? Math.min(f.to, f.a + f.sp) : Math.max(f.to, f.a - f.sp);
  if (G.shake > 0) G.shake--; if (G.flash > 0) G.flash--; if (G.goalFlash > 0) G.goalFlash--; if (G.floorFlash > 0) G.floorFlash--;
  if (G.toast && G.toast.t > 0) G.toast.t--; G.beat = (G.beat || 0) * 0.92;
  if (UI.settings) updateSettings();                       // 설정이 열려 있는 동안 게임 정지
  else if (G.mode === 'title') updateTitle();
  else if (G.mode === 'gameover') { G.over.t++; if (G.over.t > 100 && KP.ok) reload(); }
  else if (G.mode === 'play') {
    if (KP.esc && !UI.safe && !UI.note && !UI.book) openSettings();
    else if (UI.book) updateBook();
    else if (UI.safe) updateSafe();
    else if (EV.steps) updateEvent();
    else if (MAP) updateWorld();
  }
  audioTick();
  for (const k in KP) delete KP[k];
}
function render() {
  if (G.mode === 'title' || G.mode === 'loading') SCENES.prologue.draw();
  else if (G.mode === 'gameover') {
    const o = G.over; R('#000', 0, 0, W, H);
    if (o.t < 40) {      // 짧은 점프스케어
      R(o.t % 6 < 3 ? '#300000' : '#000', 0, 0, W, H);
      g.save(); g.translate(240 + rnd(-6, 6), 330 + rnd(-4, 4) - o.t); g.scale(15, 15);
      if (o.kind === 'model') drawModel(g, 0, 0);
      else { const k = GHOST_PAL[o.kind] ? o.kind : (o.kind === 'hand' ? 'shadow' : 'bunshin'); drawChar(g, 0, 0, 0, 0, GHOST_PAL[k], { eye: k === 'shadow' ? '#e8e8e8' : '#ff2020', noShadow: 1, plain: 1 }); }
      g.restore();
    }
  }
  else if (G.scene && SCENES[G.scene]) SCENES[G.scene].draw();
  else if (MAP) renderWorld();
  else R('#000', 0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W * SCALE, H * SCALE);          // 정수 배율 확대
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  drawUI(ctx);
}
let lastTs = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  acc += Math.min(100, ts - lastTs); lastTs = ts;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { if (!window.__gamePause) update(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  render();
}
// 창 크기에 맞춰 정수 배율(픽셀이 뭉개지지 않게)
function resize() {
  const dpr = window.devicePixelRatio || 1;
  SCALE = Math.max(1, Math.floor(Math.min(window.innerWidth * dpr / W, window.innerHeight * dpr / H)));
  cv.width = W * SCALE; cv.height = H * SCALE;
  cv.style.width = (W * SCALE / dpr) + 'px'; cv.style.height = (H * SCALE / dpr) + 'px';
}
function boot() {
  loadSettings(); resize(); window.addEventListener('resize', resize); auLoadFiles();
  // 폰트 로딩이 끝난 뒤 타이틀(최대 4초 대기)
  const fonts = ['NoticeHand', 'MinjaeHand', 'SujinHand'];
  const toTitle = () => { if (G.mode === 'loading') G.mode = 'title'; };
  try {
    Promise.all(fonts.map(fn => document.fonts.load('18px "' + fn + '"', '가나다 0123').then(r => { FONT_OK[fn] = !!(r && r.length); }).catch(() => { }))).then(toTitle);
  } catch (e) { toTitle(); }
  setTimeout(toTitle, 4000);
  requestAnimationFrame(loop);
}
// 시험용 손잡이(콘솔에서 __game.update() 등으로 직접 돌려 볼 수 있다)
window.__game = { G, P, A, K, KP, EV, UI, SET, AU, CH, FN, update, render, enterMap, runEvent, give, saveGame, reload, newGame,
  get S() { return S; }, get F() { return F; }, get MAP() { return MAP; } };
boot();
</script>
